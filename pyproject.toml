[project]
name = "cogenerate"
version = "0.1.0"
description = "Reassemble GSI (layers-martin) disaster-response XYZ tiles into COGs, cataloged as static STAC."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogenerate"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() as argument defaults is typer's own
# documented idiom, not the mutable-default footgun B008 warns about.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
